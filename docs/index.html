<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muhammad Abdulrehman — Project Solar System</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: radial-gradient(ellipse at center, #0b0e1a 0%, #05060c 70%, #000 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8ecf7;
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 18px 24px; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 10;
  }
  #title { pointer-events: auto; }
  #title h1 {
    margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p { margin: 4px 0 0; font-size: 0.78rem; color: #8b93b0; }

  #back {
    pointer-events: auto;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8ecf7;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.78rem;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s ease;
  }
  #back:hover { background: rgba(255,255,255,0.14); }

  .label {
    font-size: 12px;
    padding: 2px 8px;
    color: #fff;
    background: rgba(10,12,24,0.55);
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .label.sun-label { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }

  #panel {
    position: fixed;
    right: 24px; bottom: 24px;
    max-width: 340px;
    background: rgba(12,14,26,0.82);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 18px 20px;
    backdrop-filter: blur(10px);
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 10;
  }
  #panel.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #panel h2 { margin: 0 0 6px; font-size: 1rem; color: #fff; }
  #panel .tag {
    display: inline-block; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: #a78bfa; margin-bottom: 8px;
  }
  #panel p { margin: 0 0 12px; font-size: 0.82rem; line-height: 1.45; color: #c3c8dc; }
  #panel a {
    display: inline-block; font-size: 0.78rem; color: #05060c;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    padding: 7px 14px; border-radius: 8px; text-decoration: none; font-weight: 600;
  }

  #hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font-size: 0.72rem; color: #6b7290; pointer-events: none; z-index: 10;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="title">
      <h1>🪐 The Abdulrehman System</h1>
      <p>drag to orbit · scroll to zoom · click a planet to explore the project</p>
    </div>
    <button id="back" style="display:none">← reset view</button>
  </div>

  <div id="panel">
    <span class="tag" id="panel-tag">project</span>
    <h2 id="panel-title">—</h2>
    <p id="panel-desc">—</p>
    <a id="panel-link" href="#" target="_blank" rel="noopener">Open project ↗</a>
  </div>

  <div id="hint">Built with Three.js · each planet is a real project</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const PROJECTS = [
  {
    name: 'lh_engine',
    tag: 'research · robotics',
    desc: 'Hardware control layer for a robot arm — exposes the serial protocol as a REST API with a CSV-backed state store and a hardware-free simulator, driving crystallization experiments on a 96-tube rack.',
    url: 'https://github.com/mabdulrehman08',
    color: 0xf97316,
    size: 2.0,
    dist: 16,
    speed: 0.09
  },
  {
    name: 'notabdul10',
    tag: 'personal site',
    desc: 'Personal portfolio / site.',
    url: 'https://notabdul10.vercel.app',
    color: 0x60a5fa,
    size: 1.6,
    dist: 24,
    speed: 0.07
  },
  {
    name: 'shortaudit.ai',
    tag: 'ai product',
    desc: 'Upload performance confusion, hook localization, and AI clone/video-persona demand — an audit tool for short-form video.',
    url: 'https://shortaudit-ai-frontend.vercel.app',
    color: 0x34d399,
    size: 1.8,
    dist: 32,
    speed: 0.055
  },
  {
    name: 'DragonRec',
    tag: 'full-stack',
    desc: "Full-stack replacement for Drexel's intramural and club management system.",
    url: 'https://github.com/mabdulrehman08/DragonRec',
    color: 0xef4444,
    size: 1.9,
    dist: 40,
    speed: 0.045
  },
  {
    name: 'evolver.ai',
    tag: 'ai product',
    desc: 'AI-driven evolution/optimization project.',
    url: 'https://github.com/mabdulrehman08/evolver.ai',
    color: 0xa78bfa,
    size: 1.5,
    dist: 48,
    speed: 0.038
  },
  {
    name: 'TimeCapsulor',
    tag: 'web app',
    desc: 'A digital time-capsule application.',
    url: 'https://github.com/mabdulrehman08/TimeCapsulor',
    color: 0x38bdf8,
    size: 1.4,
    dist: 56,
    speed: 0.032
  },
  {
    name: 'Stitch',
    tag: 'web app',
    desc: 'TypeScript project — Stitch.',
    url: 'https://github.com/mabdulrehman08/Stitch',
    color: 0xfacc15,
    size: 1.3,
    dist: 64,
    speed: 0.028
  },
  {
    name: 'SolarFareAudit.ai',
    tag: 'ai product',
    desc: 'Solar / fare auditing tool.',
    url: 'https://github.com/mabdulrehman08/SolarFareAudit.ai',
    color: 0xfb923c,
    size: 1.5,
    dist: 72,
    speed: 0.024
  },
  {
    name: 'Dragon_hacks',
    tag: 'hackathon · finance',
    desc: 'Finance-focused hackathon project.',
    url: 'https://github.com/mabdulrehman08/Dragon_hacks',
    color: 0x22d3ee,
    size: 1.3,
    dist: 80,
    speed: 0.02
  },
  {
    name: 'dragonsconnect',
    tag: 'python',
    desc: 'Connectivity/community project built in Python.',
    url: 'https://github.com/mabdulrehman08/dragonsconnect',
    color: 0xc084fc,
    size: 1.3,
    dist: 88,
    speed: 0.017
  },
  {
    name: 'oasisstration',
    tag: 'python',
    desc: 'Python project — oasisstration.',
    url: 'https://github.com/mabdulrehman08/oasisstration',
    color: 0x4ade80,
    size: 1.2,
    dist: 96,
    speed: 0.014
  }
];

const container = document.getElementById('app');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 60, 150);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, labelRenderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 20;
controls.maxDistance = 400;

// starfield
function makeStars(count, radius) {
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = radius * (0.6 + Math.random() * 0.4);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}
scene.add(makeStars(2200, 800));

// sun
const sunGeo = new THREE.SphereGeometry(6, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd580 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

const sunGlow = new THREE.PointLight(0xffd580, 3, 300);
sun.add(sunGlow);
scene.add(new THREE.AmbientLight(0x404060, 1.2));

const sunLabelDiv = document.createElement('div');
sunLabelDiv.className = 'label sun-label';
sunLabelDiv.textContent = 'Muhammad Abdulrehman';
const sunLabel = new CSS2DObject(sunLabelDiv);
sunLabel.position.set(0, 9, 0);
sun.add(sunLabel);

const planetGroup = new THREE.Group();
scene.add(planetGroup);

const clickable = [];

PROJECTS.forEach((p) => {
  const orbitCurve = new THREE.EllipseCurve(0, 0, p.dist, p.dist, 0, 2 * Math.PI, false, 0);
  const pts = orbitCurve.getPoints(128).map(pt => new THREE.Vector3(pt.x, 0, pt.y));
  const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const orbitMat = new THREE.LineBasicMaterial({ color: 0x30354d, transparent: true, opacity: 0.5 });
  scene.add(new THREE.LineLoop(orbitGeo, orbitMat));

  const pivot = new THREE.Group();
  pivot.rotation.y = Math.random() * Math.PI * 2;
  planetGroup.add(pivot);

  const geo = new THREE.SphereGeometry(p.size, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5, metalness: 0.15, emissive: p.color, emissiveIntensity: 0.15 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(p.dist, 0, 0);
  mesh.userData = p;
  pivot.add(mesh);
  clickable.push(mesh);

  const div = document.createElement('div');
  div.className = 'label';
  div.textContent = p.name;
  const label = new CSS2DObject(div);
  label.position.set(0, p.size + 1.6, 0);
  mesh.add(label);

  p._pivot = pivot;
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const panel = document.getElementById('panel');
const backBtn = document.getElementById('back');

function showPanel(p) {
  document.getElementById('panel-tag').textContent = p.tag;
  document.getElementById('panel-title').textContent = p.name;
  document.getElementById('panel-desc').textContent = p.desc;
  document.getElementById('panel-link').href = p.url;
  panel.classList.add('visible');
}
function hidePanel() {
  panel.classList.remove('visible');
}

let focusTarget = null;

function focusOn(mesh) {
  focusTarget = mesh;
  backBtn.style.display = 'inline-block';
  showPanel(mesh.userData);
}

backBtn.addEventListener('click', () => {
  focusTarget = null;
  backBtn.style.display = 'none';
  hidePanel();
  controls.target.set(0, 0, 0);
});

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickable);
  if (hits.length) {
    focusOn(hits[0].object);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  sun.rotation.y += dt * 0.05;
  PROJECTS.forEach((p) => {
    p._pivot.rotation.y += dt * p.speed;
  });

  if (focusTarget) {
    const worldPos = new THREE.Vector3();
    focusTarget.getWorldPosition(worldPos);
    controls.target.lerp(worldPos, 0.08);
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
